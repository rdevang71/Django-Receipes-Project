{% extends "base.html" %}
{% block start %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <form class="card p-4 shadow-lg rounded" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <h2 class="text-center mb-4 text-primary">Add Recipe</h2>
        <hr>

        <div class="mb-3">
          <label for="receipe_name" class="form-label fw-semibold">Recipe Name</label>
          <input type="text" class="form-control" id="receipe_name" name="receipe_name" placeholder="Enter recipe name" required>
        </div>

        <div class="mb-3">
          <label for="receipe_description" class="form-label fw-semibold">Description</label>
          <textarea class="form-control" id="receipe_description" name="receipe_description" rows="4" placeholder="Describe your recipe" required></textarea>
        </div>

        <div class="mb-3">
          <label for="receipe_image" class="form-label fw-semibold">Upload Image</label>
          <input class="form-control" type="file" id="receipe_image" name="receipe_image" required>
        </div>

        <div class="d-grid gap-2 col-6 mx-auto mt-4">
          <button type="submit" class="btn btn-success btn-lg">Add Recipe</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
