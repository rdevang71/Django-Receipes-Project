{% extends "base.html "%}
{% block start %}
<div class="container mt-5">
    <form class="row g-3 col-8 mx-auto card p-3 shadow-lg" method="POST" enctype="multipart/form-data">
    <h2 > Add Receipe</h2>
    <hr>
  <div class="col-md-6">
    <label for="recipeName" class="form-label">Recipe Name</label>
    <input type="text" class="form-control" id="recipeName" name="name" placeholder="Enter recipe name">
  </div>

  <div class="col-12">
    <label for="description" class="form-label">Description</label>
    <textarea class="form-control" id="description" name="description" rows="4" placeholder="Describe your recipe"></textarea>
  </div>

  <div class="col-12">
    <label for="imageUpload" class="form-label">Upload Image</label>
    <input class="form-control" type="file" id="imageUpload" name="image">
  </div>

  <div class="col-12">
    <button type="submit" class="btn btn-success">Submit Recipe</button>
  </div>
</form>
</div>>

</body>
{% endblock %}
