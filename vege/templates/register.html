{% extends "base.html" %}
{% block start %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <form class="card p-4 shadow-lg rounded" method="POST">
        {% csrf_token %}
        <h2 class="text-center mb-4 text-success">Register</h2>
        <hr>

        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email address</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
          <label class="form-check-label" for="terms">
            I agree to the <a href="#" class="text-decoration-none">terms and conditions</a>
          </label>
        </div>

        <div class="d-grid gap-2 col-6 mx-auto mt-4">
          <button type="submit" class="btn btn-primary btn-lg">Register</button>
        </div>

        <div class="text-center mt-3">
          <p class="mb-0">Already have an account? <a href="{% url 'login_page' %}" class="text-decoration-none text-success">Login here</a></p>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
