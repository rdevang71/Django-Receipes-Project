{% extends "base.html" %}
{% block start %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <form class="card p-4 shadow-lg rounded" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <h2 class="text-center mb-4 text-warning">Update Recipe</h2>
        <hr>

        <div class="mb-3">
          <label for="receipe_name" class="form-label fw-semibold">Recipe Name</label>
          <input type="text" class="form-control" id="receipe_name" name="receipe_name" value="{{ recipe.receipe_name }}" required>
        </div>

        <div class="mb-3">
          <label for="receipe_description" class="form-label fw-semibold">Description</label>
          <textarea class="form-control" id="receipe_description" name="receipe_description" rows="4" required>{{ recipe.receipe_description }}</textarea>
        </div>

        <div class="mb-3">
          <label for="receipe_image" class="form-label fw-semibold">Upload New Image (optional)</label>
          <input class="form-control" type="file" id="receipe_image" name="receipe_image">
        </div>

        {% if recipe.receipe_image %}
        <div class="mb-3 text-center">
          <img src="{{ recipe.receipe_image.url }}" alt="Current Image" class="img-fluid rounded" style="max-height: 200px;">
        </div>
        {% endif %}

        <div class="d-grid gap-2 col-6 mx-auto mt-4">
          <button type="submit" class="btn btn-primary btn-lg">Update Recipe</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
